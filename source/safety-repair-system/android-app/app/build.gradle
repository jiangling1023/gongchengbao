apply plugin: 'com.android.application'

android {
    namespace 'com.safetyrepair'
    compileSdk 34
    defaultConfig {
        applicationId 'com.safetyrepair'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    // 正式签名（自签名 release 密钥库，可用于直接分发/侧载）
    // 上架应用商店时，请替换为商店提供的官方签名；此密钥库与密码仅作演示，生产前请自行重新生成并妥善保管。
    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword 'SafetyR3pair@2026'
            keyAlias 'safetyrepair'
            keyPassword 'SafetyR3pair@2026'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
